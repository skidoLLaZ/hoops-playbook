<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Up Top</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Up Top"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<style>#splash{position:fixed;inset:0;z-index:99999;background:#0b0b0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s}#splash.out{opacity:0;pointer-events:none}#splash svg{border-radius:32px;box-shadow:0 0 40px #ff7a1a33}#splash b{font:800 22px/1 "Saira Condensed",Inter,system-ui,sans-serif;letter-spacing:.2em;color:#ff7a1a;text-transform:uppercase;text-shadow:0 0 14px #ff7a1a88}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Public+Sans:wght@400;600;700&family=Saira+Condensed:wght@600;800&display=swap">
<style>
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
:root{
  --bg:#e9edf3;--surface:#f6f8fb;--ink:#14181f;--muted:#5a6678;--line:#cdd5e0;--chip:#dde3ec;
  --title:#2251c7;--off-label:#2a7a46;--def-label:#c42b2b;--accent:#e8590c;--good:#1f8f4e;--warn:#c2410c;--bad:#c8321f;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --chalk:"Gochi Hand","Comic Sans MS","Chalkboard SE","Marker Felt",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gh:.16;--gh2:.08;--gsel:.1;--selbg:#3a4352;--selfg:#f1f4f9;--selglow:transparent;--accbg:#2f7a52;
  --bg:#000;--surface:#111418;--ink:#e8edf5;--muted:#98a4b6;--line:#232a35;--chip:#1a2029;--title:#6f97ff;--off-label:#5cc485;--def-label:#f07070;--accent:#ff8a3d;--good:#4cc786;--warn:#ff9a62;--bad:#ff7a66;color-scheme:dark}}
[data-theme="dark"]{--gh:.16;--gh2:.08;--gsel:.1;--selbg:#3a4352;--selfg:#f1f4f9;--selglow:transparent;--accbg:#2f7a52}
:root[data-theme="dark"]{--bg:#000;--surface:#111418;--ink:#e8edf5;--muted:#98a4b6;--line:#232a35;--chip:#1a2029;--title:#6f97ff;--off-label:#5cc485;--def-label:#f07070;--accent:#ff8a3d;--good:#4cc786;--warn:#ff9a62;--bad:#ff7a66;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);overflow:hidden}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;line-height:1.05;letter-spacing:.02em}
h1{font-size:34px;font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:20px;font-weight:800}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--title);outline-offset:2px}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--title);outline-offset:-2px;border-color:var(--title)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* views */
:root{--gh:.55;--gh2:.22;--gsel:.35;--pt:max(16px,env(safe-area-inset-top));--pb:94px;--pbc:82px;--pr:max(16px,env(safe-area-inset-right));--pl:max(16px,env(safe-area-inset-left))}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:var(--pt) var(--pr) var(--pb) var(--pl);-webkit-overflow-scrolling:touch}
.view[hidden]{display:none}
.col{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.teaminfo{margin-top:4px}
.head .sub{margin-top:2px}

/* buttons */
.btn{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--chip);color:var(--ink);font-weight:700;font-size:14px;transition:box-shadow .2s}
.btn.pri{background:var(--title);color:#fff;border-color:transparent}
.btn.acc{background:var(--accbg,var(--off-label));color:#fff;border-color:transparent}
.btn.ghost{background:var(--chip)}
.btn.sm{padding:4px 12px;font-size:12.5px}
.btn.danger{color:var(--warn)}
.btn.danger.ghost{background:var(--chip)}
.btn[disabled]{opacity:.4;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--chip);color:var(--ink);font-weight:700;font-size:14px;transition:box-shadow .2s}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--selbg,var(--ink));color:var(--selfg,var(--bg));border-color:transparent;box-shadow:0 0 12px 2px var(--selglow,color-mix(in srgb,var(--ink) 45%,transparent))}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1 1 0;border:0;background:transparent;color:var(--ink);padding:8px 4px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;transition:box-shadow .2s}
.seg .pq{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.seg .pq::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--qc);box-shadow:0 0 0 1px rgba(0,0,0,.3);flex:none}
.seg .pq[data-k="0"]{--qc:#d9342b}.seg .pq[data-k="1"]{--qc:#7fb03c}.seg .pq[data-k="2"]{--qc:#e07b15}.seg .pq[data-k="3"]{--qc:#6c2e9b}
.seg .pq[aria-pressed="true"]{background:var(--qc);color:#fff;box-shadow:0 0 12px 2px color-mix(in srgb,var(--qc) 55%,transparent)}
.seg .pq[aria-pressed="true"]::before{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pad{padding:14px}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.o{background:color-mix(in srgb,var(--title) 18%,transparent);color:var(--title)}
.tag.d{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
input[type=text],select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:70px}
[hidden]{display:none!important}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
label.f>*:not(span){text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);font-size:15px}

/* playbook */
.sect{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:12px}
.grid.half{grid-template-columns:minmax(0,1fr)}
.grid.full{grid-template-columns:minmax(0,1fr)}
.play{display:flex;flex-direction:column;cursor:pointer;position:relative}
.play canvas{display:block;width:100%}
.play .pb{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px}
.play h3{font-size:17px;text-transform:none;font-weight:800;letter-spacing:0}
.play .tags{display:flex;gap:5px;flex-wrap:wrap}
.play .more{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-weight:800;line-height:1}
.empty{padding:28px;text-align:center;color:var(--muted)}

.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px}.ptop h3{margin:0}
.play .runb{position:absolute;top:6px;left:6px;height:30px;padding:0 11px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font:800 13px/30px var(--display);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.play .prow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cog{width:40px;height:40px;padding:0;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--chip);color:var(--ink);transition:box-shadow .2s}
.cog[aria-pressed="true"]{background:var(--selbg,var(--ink));color:var(--selfg,var(--bg));border-color:transparent;box-shadow:0 0 12px 2px var(--selglow,color-mix(in srgb,var(--ink) 45%,transparent))}
#tbody>.col{width:100%;max-width:none;margin:0}
.tight .seg button{padding:5px 4px;font-size:13px}
.tight .seg{padding:2px}
.tight p{font-size:13px!important}
.tight>div[style*="align-items:center;gap:10px"]{gap:8px!important}
.tight select[data-lineup]{height:34px;padding:0 26px 0 12px;font-size:14px;font-weight:600;border-radius:999px;width:auto;flex:1;min-width:0;background-position:right 10px center}
.tight .sdot{width:26px;height:26px;font-size:13px}
.filter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;position:relative}
.f-row{display:flex;align-items:center;gap:8px}
.f-row .seg{flex:1;min-width:0}
.f-row .seg button{padding:7px 4px;font-size:14px}
.f-lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:46px;flex:none;white-space:nowrap}
.seg .so[aria-pressed="true"]{background:var(--off-label);color:#fff;box-shadow:0 0 14px 3px color-mix(in srgb,var(--off-label) 60%,transparent)}
.seg .sd[aria-pressed="true"]{background:var(--def-label);color:#fff;box-shadow:0 0 14px 3px color-mix(in srgb,var(--def-label) 60%,transparent)}
.f-who{display:flex;align-items:center;flex-wrap:wrap;gap:6px;cursor:pointer}
.who-tag{font-size:13px;font-weight:600;background:var(--chip);border-radius:999px;padding:3px 10px;white-space:nowrap}
.who-tag b{color:var(--title);font-weight:800;margin-right:2px}.who-tag.open{color:var(--muted);font-weight:400}
.f-min{position:absolute;top:-10px;left:-10px;width:22px;height:22px;padding:0;border-radius:50%;font-size:15px;font-weight:800;line-height:1;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.f-sum{display:none;border:0;background:none;padding:0;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;align-items:center;min-width:0}
.sum-q{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:800;font-size:12.5px;color:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sum-dot{color:var(--muted);margin:0 5px}
.filter.min .f-row,.filter.min .f-who{display:none!important}
.filter.min .f-sum{display:flex}
.filter.min{padding-block:9px}
.tight .sdot.sm{font-size:11px}
.tight .btn{padding:7px 10px;font-size:13px}
.jobs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.jobs li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center}
.jobs .sdot{width:26px;height:26px;font-size:12px}.jobs .sdot.sm{font-size:10px}
.sdot.sm{font-size:12.5px;letter-spacing:-.02em}
.sdot{width:30px;height:30px;border-radius:50%;background:#1d5fd8;color:#fff;display:grid;place-items:center;font:800 15px var(--display);flex:none;box-shadow:inset 0 0 0 2px #fff}
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:10px 6px;cursor:pointer}
.lineup .lg{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.lineup small{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lineup small.empty{color:var(--muted);font-weight:400}
.prow2{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.prow2:first-of-type{border-top:0}
.jn{min-width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font:800 18px var(--display);padding:0 4px}
/* chalkboard */
#v-chalk{background:#000;color:#e9f0ea;padding-bottom:var(--pbc);display:flex;flex-direction:column;overflow:hidden}
#v-chalk[hidden]{display:none}
#v-chalk .col{flex:1;min-height:0;width:100%;gap:8px;padding-inline:8px}
.ch-top{display:flex;align-items:center;gap:8px}
.ch-title{cursor:pointer;font:400 38px/1 var(--chalk);letter-spacing:.02em;flex:1;overflow:hidden;white-space:nowrap;min-width:0}
.ch-title span{display:inline-block}
.ch-name{font:400 17px/1.1 var(--chalk);color:#cfd9d2;display:flex;align-items:center;gap:8px}
.ch-name b{font-weight:400;color:#fff;cursor:pointer;border-bottom:1.5px dashed rgba(255,255,255,.4);max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-name i{font-style:normal;color:#ffd36b}
.ch-row.nw{flex-wrap:nowrap;gap:5px}.ch-row.nw .cbtn,#ch-court .cbtn{padding:5px 8px;font-size:15px}.ch-row.nw .cbtn{flex:1}#ch-court .cbtn{flex:none}.armed{animation:armp .5s ease-in-out infinite alternate;white-space:nowrap}@keyframes armp{to{filter:brightness(1.35)}}label.f>textarea,label.f>input[type=date],label.f>input[type=search],label.f>input[type=number]{font:inherit;font-weight:400;text-transform:none;letter-spacing:0;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);color-scheme:inherit;width:100%;box-sizing:border-box}label.f>textarea{resize:vertical;line-height:1.35}.cbtn{background:#2a3832;color:#e8eee9;border:1px solid #3b4b44;border-radius:13px 7px 12px 6px/7px 12px 6px 13px;padding:6px 10px;font:400 16px/1.1 var(--chalk);letter-spacing:.02em;white-space:nowrap;text-shadow:0 0 1px rgba(255,255,255,.35)}
.cbtn[aria-pressed="true"]{background:#1f2b26;color:#ffe66b;border-color:#3b4b44;box-shadow:inset 0 0 0 1.5px rgba(255,230,107,.7),0 0 10px 1px rgba(255,230,107,.3)}
.cbtn.go{background:#2f6b3f;color:#eaffef;border-color:#3f8a52}
.cbtn.sv{background:#2251c7;color:#fff;border-color:transparent}
.cbtn[data-act="clearLines"]{background:#7a2c2c;color:#ffe9e9;border-color:#9a3c3c}
.cbtn.sm{padding:4px 9px;font-size:15px}
.cbtn[disabled]{opacity:.35;pointer-events:none}
.ch-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#ch-modes{flex-wrap:nowrap}#ch-modes .cbtn{padding:6px 9px}
.ch-row.grow>*{flex:1}
.boardwrap{flex:1;min-height:150px;position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #5a4630,0 0 0 5px #3a2c1d;background:#050505}
.boardwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{font:400 15px/1.2 var(--chalk);color:#9fb3a7;text-align:center;height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* practice */
.blk{display:flex;flex-direction:column;gap:8px}
.blk .row{display:flex;align-items:center;gap:8px}
.blk .when{font:800 13px var(--display);color:var(--muted);width:38px;text-align:right;flex:none}
.blk .nm{flex:1;min-width:0;font-weight:700;background:none;border:0;text-align:left;padding:0;cursor:pointer}
.stp{display:flex;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:999px}
.stp button{border:0;background:none;width:30px;height:30px;font-weight:800;font-size:16px;border-radius:50%}
.stp span{min-width:56px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.ib{border:0;background:none;width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:15px}
.ib:active{background:var(--chip)}
.detail{font-size:14px;color:var(--muted);padding:0 0 4px 46px;display:flex;flex-direction:column;gap:6px}
.detail ul{margin:0;padding-left:18px}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--good)}
.bar.under>i{background:var(--accent)}.bar.over>i{background:var(--bad)}

/* team */
.coach{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.coach:first-of-type{border-top:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--title);color:#fff;display:grid;place-items:center;font:800 16px var(--display)}
.note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 11px}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(520px,calc(100% - 28px));height:66px;border-radius:999px;display:flex;padding:5px;gap:2px;z-index:20;
  background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent)}
.tabbar button{flex:1;border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font:800 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.tabbar button[aria-current="page"]{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--title) 92%,#fff),var(--title));box-shadow:0 5px 14px color-mix(in srgb,var(--title) 45%,transparent)}
.chalkmode .tabbar{background:rgba(10,10,10,.92)!important;border:1px solid #2c3731!important;box-shadow:0 6px 22px rgba(0,0,0,.6)!important}
.chalkmode .tabbar button{color:#aab8af;font-family:var(--chalk);font-weight:400;font-size:16px;letter-spacing:.05em}
.chalkmode .tabbar button[aria-current="page"]{color:#fff;background:#1f2b26;box-shadow:inset 0 0 0 1.5px rgba(255,230,107,.7),0 0 12px rgba(255,230,107,.3)}
.chalkmode .tabbar button{font-size:14px;letter-spacing:.02em;white-space:nowrap}
.tabbar button{min-width:0;white-space:nowrap;flex:1 1 auto;padding:0 12px}
html[data-nav=rail-right] .tabbar button,html[data-nav=compact] .tabbar button{padding:0 8px}
.f-row .seg button{padding:7px 2px;font-size:13.5px;letter-spacing:-.01em}
.tabbar svg{width:26px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Liquid Glass material + native-style selection (all layouts) */
.tabbar{background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(26px) saturate(1.9) brightness(1.04);-webkit-backdrop-filter:blur(26px) saturate(1.9) brightness(1.04);box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,var(--gh)),inset 0 -1px 0 rgba(255,255,255,calc(var(--gh2)/2)),inset 0 0 0 1px rgba(255,255,255,var(--gh2));transition:height .25s,width .25s,transform .25s}
.tabbar button[aria-current="page"]{color:var(--title);background:color-mix(in srgb,var(--title) 20%,rgba(255,255,255,var(--gsel)));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--gh) + .1)),inset 0 0 0 1px rgba(255,255,255,var(--gh2)),0 2px 8px rgba(0,0,0,.12)}
.tabbar.min button{font-size:0;gap:0}.tabbar.min{height:54px}
/* native-scale tab bar */
.tabbar{height:56px;padding:4px;gap:0;width:min(340px,calc(100% - 48px));bottom:calc(10px + env(safe-area-inset-bottom))}
.tabbar button{padding:0 6px;gap:3px;font:600 10px/1 var(--ui,-apple-system,system-ui,sans-serif);letter-spacing:.01em;text-transform:none}
.tabbar svg{width:22px;height:20px;stroke-width:1.8}
.tabbar.min{height:46px}
.chalkmode .tabbar button{font:400 12px/1 var(--chalk);letter-spacing:.02em}
/* layouts by device shape (set by script as html[data-nav]) */
html[data-nav=top]{--pt:calc(max(10px,env(safe-area-inset-top)) + 68px);--pb:32px;--pbc:20px}
html[data-nav=top] .tabbar{bottom:auto;top:calc(max(10px,env(safe-area-inset-top)) + 2px);width:min(420px,calc(100% - 32px));height:48px}
html[data-nav=top] .tabbar button{flex-direction:row;gap:7px;font-size:13px}html[data-nav=top] .tabbar.min{height:48px}html[data-nav=top] .tabbar.min button{font-size:13px;gap:8px}
html[data-nav=top] #toast{bottom:calc(24px + env(safe-area-inset-bottom))}

<script>
(()=>{'use strict';
/* ===== helpers ===== */
const LS='hoops.proto.v1';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hyp=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2300)}

/* ===== polyline geometry ===== */
function polyLen(p){let L=0;for(let i=1;i<p.length;i++)L+=hyp(p[i-1],p[i]);return L}
function pointAt(p,d){if(d<=0)return p[0].slice();for(let i=1;i<p.length;i++){const l=hyp(p[i-1],p[i]);if(d<=l||i===p.length-1){const t=l?Math.min(1,d/l):0;return[p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t]}d-=l}return p[p.length-1].slice()}
function subPath(p,d0,d1){const L=polyLen(p);if(L<=d0+d1+.5)return p.map(q=>q.slice());const out=[pointAt(p,d0)];let acc=0;for(let i=1;i<p.length;i++){acc+=hyp(p[i-1],p[i]);if(acc>d0&&acc<L-d1)out.push(p[i].slice())}out.push(pointAt(p,L-d1));return out}
function rdp(pts,eps){if(pts.length<3)return pts;let mx=0,ix=0;const a=pts[0],b=pts[pts.length-1];for(let i=1;i<pts.length-1;i++){const d=segDist(pts[i],a,b);if(d>mx){mx=d;ix=i}}if(mx>eps){const l=rdp(pts.slice(0,ix+1),eps),r=rdp(pts.slice(ix),eps);return l.slice(0,-1).concat(r)}return[a,b]}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;if(!l)return hyp(p,a);const t=clamp(((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l,0,1);return hyp(p,[a[0]+dx*t,a[1]+dy*t])}

/* ===== formations (feet; basket at top; half court 50x47, full 50x94) ===== */
const BASKET_Y=5.25;
const OFF={
  half:{'5-Out':[[25,33],[8,25],[42,25],[6,11],[44,11]],
        '4-Out 1-In':[[25,33],[8,25],[42,25],[44,12],[25,11]],
        '1-4 High':[[25,34],[9,19],[19,19],[31,19],[41,19]],
        '2-1-2':[[18,32],[32,32],[25,21],[8,12],[42,12]],
        'Box inbounds':[[38,-2],[17,5],[33,5],[17,17],[33,17]]},
  full:{'Inbound spread':[[30,96],[14,82],[36,82],[25,70],[25,56]],
        'Inbound stack':[[30,96],[22,85],[22,78],[28,66],[25,54]]}};
const manHalf=o=>o.map(p=>{const v=[25-p[0],BASKET_Y-p[1]],l=Math.hypot(v[0],v[1])||1;return[p[0]+v[0]/l*4.5,p[1]+v[1]/l*4.5]});
const DEF={
  half:{'None':null,
        'Man-to-man':f=>manHalf(f),
        '2-3 zone':()=>[[19,21],[31,21],[11,10],[25,8],[39,10]],
        '1-3-1 zone':()=>[[25,27],[11,17],[25,16],[39,17],[25,8]],
        '3-2 zone':()=>[[10,24],[25,26],[40,24],[17,10],[33,10]]},
  full:{'None':null,
        'Man press':f=>f.map((p,i)=>i===0?[28,91]:[p[0],p[1]-4]),
        '2-2-1 press':()=>[[18,85],[32,85],[13,66],[37,66],[25,38]],
        '1-2-1-1 press':()=>[[25,87],[14,72],[36,72],[25,55],[25,34]],
        '1-2-2 press':()=>[[25,86],[14,74],[36,74],[16,52],[34,52]]}};
function mkPlayers(court,off,def){
  const f=OFF[court][off]||Object.values(OFF[court])[0];
  const P=f.map((p,i)=>({id:'o'+(i+1),team:'o',n:i+1,x:p[0],y:p[1]}));
  const g=DEF[court][def];
  if(g)g(f).forEach((p,i)=>P.push({id:'d'+(i+1),team:'d',n:i+1,x:p[0],y:p[1]}));
  return P}
function newPlay(o={}){
  const court=o.court||'half',off=o.off||(court==='full'?'Inbound spread':'5-Out'),def=o.def||'None';
  const p={id:uid(),name:'New play',court,tags:['Offense'],off,def,ball:'o1',actions:[],notes:'',by:'You',...o};
  p.players=o.players||mkPlayers(court,off,def);normPlay(p);return p}
const SIDEL={o:'Offense',d:'Defense'};
const CATL={o:{half:'Half court play',press:'Press break',inb:'Inbounds play'},d:{half:'Half court defense',press:'Press',inb:'Inbounds defense'}};
const CATH={o:{half:'Offense · Half court plays',press:'Offense · Press breaks',inb:'Offense · Inbounds plays'},d:{half:'Defense · Half court defense',press:'Defense · Presses',inb:'Defense · Inbounds defense'}};
const PCATS={o:{half:'Half court',press:'Press break',inb:'Inbounds'},d:{half:'Half court',press:'Press',inb:'Inbounds'}};
function normPlay(p){
  if(!(p.side&&p.cat&&CATL[p.side]&&CATL[p.side][p.cat])){const t=p.tags||[];
    p.side=(t.includes('Defense')||t.includes('Press'))?'d':'o';
    p.cat=(t.includes('Press break')||t.includes('Press'))?'press':t.includes('Inbounds')?'inb':'half'}
  p.focus=p.side;p.tags=[SIDEL[p.side],PCATS[p.side][p.cat]];return p}

const A={
  cut:(pid,step,pts)=>({id:uid(),kind:'cut',pid,step,pts}),
  drb:(pid,step,pts)=>({id:uid(),kind:'dribble',pid,step,pts}),
  scr:(pid,step,pts)=>({id:uid(),kind:'screen',pid,step,pts}),
  pass:(pid,to,step)=>({id:uid(),kind:'pass',pid,to,step})};

/* ===== seed data ===== */
function seed(){
  const plays=[
   newPlay({name:'Give & Go',tags:['Offense'],notes:'Pass, then cut hard to the basket. Show your hands for the return pass.',
     actions:[A.pass('o1','o2',1),A.cut('o1',2,[[22,24],[23,12]]),A.pass('o2','o1',3)]}),
   newPlay({name:'Pick & Roll',tags:['Offense'],notes:'Screener plants feet. Ball handler drives off the screener, screener rolls to the basket.',
     players:[{id:'o1',team:'o',n:1,x:25,y:34},{id:'o2',team:'o',n:2,x:6,y:24},{id:'o3',team:'o',n:3,x:44,y:24},{id:'o4',team:'o',n:4,x:7,y:10},{id:'o5',team:'o',n:5,x:31,y:27}],
     actions:[A.scr('o5',1,[[30,29]]),A.drb('o1',2,[[36,27],[36,17]]),A.cut('o5',2,[[26,22],[25,12]]),A.pass('o1','o5',3)]}),

     actions:[A.drb('o1',1,[[28,26],[30,17]]),A.pass('o1','o5',2)]}),
   newPlay({name:'5-Out Spacing',tags:['Offense'],notes:'Everyone starts on a dot. Pass around the outside and stay far enough apart that you could not touch a teammate.',
     actions:[A.pass('o1','o2',1),A.pass('o2','o3',2),A.pass('o3','o1',3)]}),
   newPlay({name:'Box Inbound',tags:['Inbounds'],off:'Box inbounds',ball:'o1',notes:'Five-man box under the basket. Screen, cut, then inbound to the open player.',
     actions:[A.scr('o5',1,[[33,10]]),A.cut('o3',2,[[36,16],[40,24]]),A.pass('o1','o3',3)]}),
   newPlay({name:'Man-to-Man',tags:['Defense'],def:'Man-to-man',notes:'Stay between your player and the basket. Hands up, knees bent.',
     actions:[A.drb('o1',1,[[31,30]]),A.cut('d1',1,[[31,26]]),A.pass('o1','o3',2),A.cut('d1',2,[[34,20]]),A.cut('d3',2,[[41,22]]),A.cut('d2',2,[[22,18]])]}),
   newPlay({name:'2-3 Zone',tags:['Defense'],def:'2-3 zone',notes:'Two up top, three across the lane. Guard the space, not a person.',
     actions:[A.pass('o1','o2',1),A.cut('d1',1,[[14,23]]),A.cut('d2',1,[[24,19]]),A.cut('d3',1,[[10,15]]),A.cut('d4',1,[[19,9]]),A.pass('o2','o1',2),A.cut('d1',2,[[19,21]]),A.cut('d2',2,[[31,21]]),A.cut('d3',2,[[11,10]]),A.cut('d4',2,[[25,8]])]}),
   newPlay({name:'1-3-1 Zone',tags:['Defense'],def:'1-3-1 zone',notes:'Point stays high, three across the middle, one protects the basket.',
     actions:[A.pass('o1','o3',1),A.cut('d1',1,[[33,26]]),A.cut('d3',1,[[31,16]]),A.cut('d4',1,[[41,18]]),A.cut('d2',1,[[17,17]]),A.pass('o3','o1',2),A.cut('d1',2,[[25,27]]),A.cut('d3',2,[[25,16]]),A.cut('d4',2,[[39,17]]),A.cut('d2',2,[[11,17]])]}),
   newPlay({name:'Box Inbounds Defense',side:'d',cat:'inb',off:'Box inbounds',def:'Man-to-man',ball:'o1',notes:'Stay between your player and the ball. Deny the first pass, then follow your player.',
     actions:[A.scr('o5',1,[[33,10]]),A.cut('d5',1,[[31,12]]),A.cut('o3',2,[[36,16],[40,24]]),A.cut('d3',2,[[34,16],[38,22]]),A.pass('o1','o3',3),A.cut('d1',3,[[36,3]])]}),
   newPlay({name:'Sideline Press Break',court:'full',tags:['Press break'],def:'2-2-1 press',notes:'Get the ball to the sideline player, dribble up the sideline, find the middle.',
     actions:[A.cut('o2',1,[[12,88]]),A.pass('o1','o2',1),A.drb('o2',2,[[12,74],[12,58]]),A.cut('o4',2,[[25,62]]),A.cut('o3',2,[[38,58]]),A.pass('o2','o4',3)]}),
   newPlay({name:'Middle Flash Break',court:'full',tags:['Press break'],def:'2-2-1 press',notes:'Middle player flashes to the ball. Everyone else sprints ahead.',
     actions:[A.cut('o4',1,[[25,64]]),A.pass('o1','o4',1),A.cut('o5',2,[[22,44]]),A.cut('o2',2,[[12,42]]),A.cut('o3',2,[[38,42]]),A.pass('o4','o5',2)]}),

const easeU=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function actE(p,a,u){
  if(a.after&&p.actions.some(x=>x.kind==='screen'&&x.step===a.step&&x.pid===a.after))return easeU(Math.max(0,(u-.5)/.5));
  if(a.kind==='screen'&&p.actions.some(x=>x.step===a.step&&x.after===a.pid))return easeU(Math.min(1,u/.5));
  return easeU(u)}
const stepMs=(p,s)=>p.actions.some(a=>a.step===s&&a.kind==='pass')&&!p.actions.some(a=>a.step===s&&a.kind!=='pass')?800:1500;
function stepAt(p,ms,el){for(let s=1;s<=ms;s++){const d=stepMs(p,s);if(el<d)return{s,u:el/d};el-=d}return null}
function endState(p,ms,off){const pos=posAt(p,ms+1),h=ballAt(p,ms+1);return{pos,ball:{x:pos[h].x+off,y:pos[h].y-off}}}
let cardRun=null;

  if(b)b.textContent=mode==='done'?'↻ Re-run':mode==='run'?'■ Stop':'▶ Run';if(r)r.hidden=mode!=='done'}

function runCard(t){
  const p=S.plays.find(x=>x.id===t.dataset.id),pv=t.closest('#pv'),cv=pv?pv.querySelector('canvas'):(t.closest('.play')||t).querySelector('canvas');if(!p||!cv)return;
  if(cardRun&&cardRun.cv===cv){stopCard();return}
  stopCard();const ms=maxStep(p);
  if(!ms){toast('No lines on this play yet. Tap Edit to draw it.');return}
  const v=viewOf(p.court,cv.clientWidth,cv.clientHeight,true),r=Math.max(1.8,5/v.s),off=ballOff(r),dur=1500,t0=performance.now();
  cardRun={cv,play:p,raf:0};const me=cardRun;cardUI(cv,'run');
  const tick=now=>{if(cardRun!==me)return;const el=now-t0;
    const L=stepAt(p,ms,el);if(!L){cardRun=null;const E=endState(p,ms,off);drawBoard(cv,p,{thumb:true,step:ms,pos:E.pos,ball:E.ball,running:true,showDef:true});cardUI(cv,'done');return}
    const s=L.s,u=L.u,e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,st=posAt(p,s),pos={};
    for(const k in st)pos[k]={...st[k]};
    for(const a of p.actions)if(a.step===s&&a.kind!=='pass'&&st[a.pid]){const pts=[[st[a.pid].x,st[a.pid].y],...a.pts],q=pointAt(pts,polyLen(pts)*actE(p,a,u));pos[a.pid]={x:q[0],y:q[1]}}
    const pass=p.actions.find(a=>a.step===s&&a.kind==='pass'),h=ballAt(p,s);let ball;
    if(pass){const A1=pos[pass.pid],B1=pos[pass.to];ball={x:A1.x+(B1.x-A1.x)*e+off,y:A1.y+(B1.y-A1.y)*e-off}}else ball={x:pos[h].x+off,y:pos[h].y-off};

  setPeriod:t=>{S.q=+t.dataset.v;persist();U.tab==='playbook'?renderPlaybook():renderTeam()},

  clearPeriod:t=>{const k=t&&t.dataset&&t.dataset.v!==undefined?+t.dataset.v:S.q;S.lineups[k]=[null,null,null,null,null];persist();renderTeam()},
  setPeriodStay:()=>{},
  autoFill:()=>{const R=S.roster;if(R.length<2){toast('Add more players first');return}
    const cnt={},last={};R.forEach(p=>{cnt[p.id]=0;last[p.id]=-9});
    const out=[];
    for(let k=0;k<S.periods;k++){
      const pick=[...R].sort((a,b)=>cnt[a.id]-cnt[b.id]||last[a.id]-last[b.id]||R.indexOf(a)-R.indexOf(b)).slice(0,5);
      const ids=new Set(pick.map(p=>p.id)),lu=[null,null,null,null,null];
      (out[k-1]||[]).forEach((id,i)=>{if(id&&ids.has(id)){lu[i]=id;ids.delete(id)}});
      for(const id of ids){lu[lu.indexOf(null)]=id}
      lu.forEach(id=>{if(id){cnt[id]++;last[id]=k}});out.push(lu)}
    S.lineups=out;persist();renderTeam();toast('Rotation filled in. Everyone plays about the same.')},
  goRoster:()=>{U.tsub='court';setTab('team')},
  tback:()=>{U.tsub=U.tprev||'roster';U.pv=null;renderTeam();$('#v-team').scrollTop=0},
  tsub:t=>{if(t.dataset.v==='settings'&&U.tsub!=='settings')U.tprev=U.tsub;U.tsub=t.dataset.v;U.pv=null;renderTeam();$('#v-team').scrollTop=0},
  addPlayer:()=>playerSheet(null),
  editPlayer:t=>playerSheet(t.dataset.id),
  savePlayer:()=>savePlayerFn(false),
  savePlayerMore:()=>savePlayerFn(true),
  delPlayer:()=>{const id=U.editP;S.roster=S.roster.filter(x=>x.id!==id);S.lineups=S.lineups.map(l=>l.map(x=>x===id?null:x));persist();closeSheet();renderTeam()},
  addMany:()=>sheet(`<div class="stack"><h3>Add several players</h3><p class="muted">One player per line. Put the jersey number first or last, like <b>12 Ava</b> or <b>Ava 12</b>. A number is optional.</p><textarea id="many" style="min-height:160px" placeholder="12 Ava&#10;Ben 7&#10;Caleb"></textarea><div class="btns"><button class="btn pri" data-act="addManyGo">Add players</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div></div>`),
  addManyGo:()=>{let n=0;for(const raw of $('#many').value.split('\n')){const l=raw.trim();if(!l)continue;let m=l.match(/^#?(\d{1,3})[\s.:-]+(.+)$/),num='',name=l;if(m){num=m[1];name=m[2]}else if(m=l.match(/^(.+?)[\s]+#?(\d{1,3})$/)){name=m[1];num=m[2]}S.roster.push({id:uid(),name:name.slice(0,30),num,notes:''});n++}
    if(!n){toast('Nothing to add yet');return}persist();closeSheet();renderTeam();toast('Added '+n+' player'+(n>1?'s':''))},
  fside:t=>{U.fside=t.dataset.v;renderPlaybook()},
  fcat:t=>{U.fcat=t.dataset.v;renderPlaybook()},
  fmin:()=>{U.fmin=!U.fmin;try{localStorage.setItem('hoops.fmin',U.fmin?'1':'0')}catch(e){}renderPlaybook()},
  fexp:()=>{U.fmin=false;try{localStorage.setItem('hoops.fmin','0')}catch(e){}renderPlaybook()},
  newPlay:()=>guardDirty(()=>{B.play=newPlay();B.openId=null;B.step=1;B.undo=[];B.dirty=false;setTab('chalk');playSheet()}),
  openPlay:t=>{const p=S.plays.find(x=>x.id===t.dataset.id);try{closeSheet()}catch(e){}if(p)guardDirty(()=>openPlayOnBoard(p))},
  playMenu:(t,e)=>{e.stopPropagation();const id=t.dataset.id,p=S.plays.find(x=>x.id===id);
    sheet(`<div class="stack"><h3>${esc(p.name)}</h3><div class="btns"><button class="btn" data-act="openPlay" data-id="${id}">Edit play</button><button class="btn" data-act="dupPlay" data-id="${id}">Duplicate</button><button class="btn danger" data-act="delPlay" data-id="${id}">Delete</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div></div>`)},
  dupPlay:t=>{const p=S.plays.find(x=>x.id===t.dataset.id);S.plays.push({...clone(p),id:uid(),name:p.name+' copy'});persist();closeSheet();renderPlaybook();toast('Duplicated')},
  delPlay:t=>{S.plays=S.plays.filter(x=>x.id!==t.dataset.id);if(B.openId===t.dataset.id)B.openId=null;persist();closeSheet();renderPlaybook()},
  closeSheet:()=>closeSheet(),
  gdSave:()=>{closeSheet();savePlay(false);const n=U.gd;U.gd=null;n&&n()},
  gdDiscard:()=>{closeSheet();B.dirty=false;const n=U.gd;U.gd=null;n&&n()},
  chSheet:()=>playSheet(),
  chSave:()=>{if(B.openId)savePlay(false);else playSheet()},
  chHelp:()=>sheet(`<div class="stack"><h3>How the chalkboard works</h3>
    <p><b>Draw:</b> drag from a player to draw a line. Pick the line type: <b>Cut</b> (solid), <b>Dribble</b> (squiggle, ball handler only), <b>Pass</b> (dashed, drag onto a teammate) or <b>Screen</b> (ends in a bar).</p>
    <p><b>Steps:</b> lines in step 1 happen first, then step 2, and so on. Lines in the same step happen together. Step 2 starts where step 1 ended.</p>
    <p><b>Move:</b> drag players to new spots at step 1. Tap a blue player to give them the ball.</p>
    <p><b>Run it</b> plays the whole thing. Nothing is saved until you tap Save.</p><button class="btn pri" data-act="closeSheet">Got it</button></div>`),
  court:t=>{const c=t.dataset.v,p=B.play;if(p.court===c)return;pushUndo();p.court=c;p.off=c==='full'?'Inbound spread':'5-Out';p.def='None';p.players=mkPlayers(c,p.off,'None');p.actions=[];p.ball='o1';B.step=1;changed()},
  showDef:()=>{B.showDef=!B.showDef;updateChalkUI();redraw()},
  mode:t=>{B.mode=t.dataset.v;updateChalkUI()},
  tool:t=>{B.tool=t.dataset.v;B.mode='draw';updateChalkUI()},
  step:t=>{B.step=+t.dataset.v;updateChalkUI();redraw()},
  run:()=>runPlay(),
  runReset:()=>stopRun(),
  ctQ:t=>{U.cq=t.dataset.v==='a'?'a':+t.dataset.v;renderCourt()},
  waitSet:t=>{const a=B.play.actions.find(x=>x.id===t.dataset.aid);if(a){pushUndo();a.after=t.dataset.sc;B.dirty=true}closeSheet();updateChalkUI();redraw()},
  undo:()=>undo(),
  clearLines:()=>{pushUndo();B.play.actions=[];B.step=1;changed()},
  pside:t=>{const p=B.play;p.side=t.dataset.v;normPlay(p);B.dirty=true;$('#ps-type').innerHTML=typeUI(p);redraw();updateChalkUI&&updateChalkUI()},
  pcat:t=>{const p=B.play;p.cat=t.dataset.v;normPlay(p);B.dirty=true;
    if(!p.actions.length){const want=p.cat==='press'?'full':'half';if(p.court!==want){try{act.court({dataset:{v:want}})}catch(e){}}}
    $('#ps-type').innerHTML=typeUI(p);redraw()},
  psSave:()=>{readSheetFields();closeSheet();savePlay(false)},
  psSaveNew:()=>{readSheetFields();closeSheet();savePlay(true)},
  psDone:()=>{readSheetFields();B.dirty=true;closeSheet();updateChalkUI();redraw()},
  psDelete:()=>{S.plays=S.plays.filter(x=>x.id!==B.openId);B.openId=null;B.dirty=false;B.play=newPlay();B.undo=[];persist();closeSheet();setTab('playbook')},
  /* practice */
  newPlan:t=>{const n=+t.dataset.v,pl={id:uid(),name:n===15?'New warm-up':'New practice',target:n,blocks:[],notes:'',date:''};S.plans.unshift(pl);U.pv=pl.id;persist();renderPractice()},
  openPlan:t=>{U.pv=t.dataset.id;renderPractice();$('#v-team').scrollTop=0},
  planBack:()=>{U.pv=null;renderPractice()},
  planTarget:t=>{S.plans.find(x=>x.id===U.pv).target=+t.dataset.v;persist();renderPractice()},
  toggleDrill:t=>{const id=t.dataset.id;U.open.has(id)?U.open.delete(id):U.open.add(id);renderPractice()},
  blkMin:t=>{const pl=S.plans.find(x=>x.id===U.pv),b=pl.blocks.find(x=>x.id===t.dataset.id);b.min=clamp(b.min+ +t.dataset.v,1,60);persist();renderPractice()},
  blkMove:t=>{const pl=S.plans.find(x=>x.id===U.pv),i=pl.blocks.findIndex(x=>x.id===t.dataset.id),j=i+ +t.dataset.v;if(j<0||j>=pl.blocks.length)return;[pl.blocks[i],pl.blocks[j]]=[pl.blocks[j],pl.blocks[i]];persist();renderPractice()},
  blkDel:t=>{const pl=S.plans.find(x=>x.id===U.pv);pl.blocks=pl.blocks.filter(x=>x.id!==t.dataset.id);persist();renderPractice()},
  addDrill:()=>drillSheet(''),
  psub:t=>{U.psub=t.dataset.v;U.pv=null;renderPractice()},
  dcat:t=>{U.dcat=t.dataset.v;renderDrills()},
  drillNew:t=>{U.addTo=!!t.dataset.addto;closeSheet();setTimeout(()=>drillEditor(null),260)},
  drillEdit:t=>{U.addTo=false;drillEditor(t.dataset.id)},
  drillSave:()=>{const d=U.de;if(!d)return;const g=i=>document.getElementById(i).value;
    d.name=g('de-name').trim();if(!d.name){toast('Give the drill a name');return}
    d.cat=g('de-cat').trim()||'Other';d.min=clamp(parseInt(g('de-min'))||5,1,60);d.players=g('de-players').trim();d.equip=g('de-equip').trim();d.setup=g('de-setup').trim();d.cues=g('de-cues').split('\n').map(x=>x.trim()).filter(Boolean);d.notes=g('de-notes').trim();
    const isNew=d._new;delete d._new;const i=S.drills.findIndex(x=>x.id===d.id);if(i>=0)S.drills[i]=d;else S.drills.unshift(d);
    if(isNew&&U.addTo&&U.pv){const pl=S.plans.find(x=>x.id===U.pv);if(pl)pl.blocks.push({id:uid(),drill:d.id,min:d.min,note:''})}
    U.addTo=false;U.de=null;persist();closeSheet();renderPractice();toast('Drill saved')},
  drillDup:t=>{const d=clone(drill(t.dataset.id));d.id=uid();d.name+=' copy';S.drills.unshift(d);persist();closeSheet();U.psub='drills';U.pv=null;renderPractice();toast('Duplicated')},
  drillDel:t=>{S.drills=S.drills.filter(x=>x.id!==t.dataset.id);persist();closeSheet();renderPractice();toast('Drill deleted')},
  drillCat:t=>drillSheet(t.dataset.v),
  pickDrill:t=>{const pl=S.plans.find(x=>x.id===U.pv),d=drill(t.dataset.id);pl.blocks.push({id:uid(),drill:d.id,min:d.min,note:''});persist();closeSheet();renderPractice();toast('Added '+d.name)},
  planMenu:()=>sheet(`<div class="stack"><h3>Practice plan</h3><div class="btns"><button class="btn" data-act="dupPlan">Duplicate</button><button class="btn danger" data-act="delPlan">Delete</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div></div>`),
  dupPlan:()=>{const pl=S.plans.find(x=>x.id===U.pv),n={...clone(pl),id:uid(),name:pl.name+' copy'};n.blocks.forEach(b=>b.id=uid());S.plans.unshift(n);U.pv=n.id;persist();closeSheet();renderPractice()},
  delPlan:()=>{S.plans=S.plans.filter(x=>x.id!==U.pv);U.pv=null;persist();closeSheet();renderPractice()},
  copyPlan:()=>{const pl=S.plans.find(x=>x.id===U.pv);let acc=0;
    const txt=`${pl.name}${pl.date?' · '+fmtDate(pl.date):''} (${planTotal(pl)} min)\n${pl.notes?'Notes: '+pl.notes+'\n':''}`+pl.blocks.map(b=>{const d=drill(b.drill),s=acc;acc+=b.min;return`\n${fmtT(s)}  ${d.name} (${b.min} min)${d.players||d.equip?'\n   '+[d.players,d.equip].filter(Boolean).join(' · '):''}\n   ${d.setup}\n   Cues: ${d.cues.join('; ')}${b.note?'\n   Note: '+b.note:''}`}).join('\n');
    copyText(txt,'Practice plan copied')},
  /* team */
  invite:()=>sheet(`<div class="stack"><h3>Invite a coach</h3><p class="note">Preview only. In the iOS app, coaches join with a link or short code. Here you can see what each role can do and add a name to the list.</p>
    <table class="perm"><tr><th></th><th>Owner</th><th>Co-owner</th><th>Editor</th><th>Viewer</th></tr>
    ${[['Run and view plays',1,1,1,1],['Add plays and practices',1,1,1,0],['Edit lineups and plays',1,1,1,0],['Delete plays',1,1,0,0],['Change roster',1,1,0,0],['Delete the playbook',1,0,0,0]].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(x=>`<td>${x?'✓':'–'}</td>`).join('')}</tr>`).join('')}</table>
    <label class="f"><span>Coach name</span><input type="text" id="inv-name" maxlength="24" placeholder="Name"></label>
    <label class="f"><span>Role</span><select id="inv-role">${ROLES.slice(1).map(r=>`<option>${r[0]}</option>`).join('')}</select></label>
    <div class="btns"><button class="btn pri" data-act="addCoach">Add to list</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div></div>`),
  addCoach:()=>{const n=$('#inv-name').value.trim();if(!n){toast('Add a name first');return}S.team.coaches.push({id:uid(),name:n,role:$('#inv-role').value});persist();closeSheet();renderTeam()},
  rmCoach:t=>{S.team.coaches=S.team.coaches.filter(c=>c.id!==t.dataset.id);persist();renderTeam()},
  theme:t=>{S.settings.theme=t.dataset.v;persist();applyTheme();renderTeam()},
  copyBackup:()=>copyText(JSON.stringify(S),'Backup copied. Paste it somewhere safe.'),
  restoreSheet:()=>sheet(`<div class="stack"><h3>Restore a backup</h3><p class="muted">Paste a backup you copied earlier. This replaces everything in the app.</p><textarea id="rs-text" placeholder="Paste backup here"></textarea><div class="btns"><button class="btn pri" data-act="restoreGo">Restore</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div></div>`),
  restoreGo:()=>{try{const o=JSON.parse($('#rs-text').value);if(!o||!Array.isArray(o.plays)||!Array.isArray(o.plans))throw 0;S=o;S.settings=S.settings||{theme:'system'};S.roster=S.roster||[];fixLU();persist();closeSheet();applyTheme();B.play=newPlay();B.openId=null;B.dirty=false;setTab('team');toast('Backup restored')}catch(e){toast('That does not look like a backup')}},
  resetAll:()=>{S=seed();fixLU();persist();closeSheet();applyTheme();B.play=newPlay();B.openId=null;B.dirty=false;U.pv=null;setTab('playbook');toast('Reset to starter plays')}
};
function copyText(txt,msg){try{navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>fallbackCopy(txt))}catch(e){fallbackCopy(txt)}}
function fallbackCopy(txt){sheet(`<div class="stack"><h3>Copy this</h3><p class="muted">Your browser blocked automatic copying. Select the text and copy it.</p><textarea id="cp" style="min-height:160px">${esc(txt)}</textarea><button class="btn pri" data-act="closeSheet">Done</button></div>`);setTimeout(()=>{const t=$('#cp');t&&t.select()},60)}
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.lineup!==undefined){const k=el.dataset.p!==undefined?+el.dataset.p:S.q,i=+el.dataset.lineup,id=el.value||null,lu=S.lineups[k];if(id)S.lineups[k]=lu.map(x=>x===id?null:x);S.lineups[k][i]=id;persist();renderTeam()}});
const CONF={drillDel:3,clearLines:2,clearPeriod:2,delPlay:3,psDelete:3,delPlan:3,delPlayer:3,resetAll:3,blkDel:3};
function armed(t){const need=CONF[t.dataset.act];if(!need)return true;
  const n=(+t.dataset.tc||0)+1;
  if(n>=need){delete t.dataset.tc;return true}
  if(t._lab===undefined)t._lab=t.innerHTML;
  t.dataset.tc=n;const left=need-n;t.innerHTML=need===2?'Sure?':'Sure? ×'+left;t.classList.add('armed');
  clearTimeout(t._tm);t._tm=setTimeout(()=>{delete t.dataset.tc;t.classList.remove('armed');if(t._lab!==undefined)t.innerHTML=t._lab;t._lab=undefined},3500);
  return false}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&act[t.dataset.act]){if(!armed(t))return;if(B.done&&!['run','runReset'].includes(t.dataset.act)){B.done=false;B.runPos=null;B.runBall=null;redraw()}act[t.dataset.act](t,e)}});
function setNav(){const w=innerWidth,h=innerHeight;let m='bottom';
  const sw=Math.min(screen.width||0,screen.height||0);
  if(w>h&&h<520)m='compact';else if(w>=600)m='top';else if(w<h&&(w>=460||(sw>=455&&sw<560)))m='rail-right';
  document.documentElement.dataset.lay=(w>h&&w>=640)?'land':'port';
  if(document.documentElement.dataset.nav!==m){document.documentElement.dataset.nav=m;$('#tabbar').classList.remove('min')}}
setNav();addEventListener('resize',setNav);addEventListener('orientationchange',setNav);
$$('.view').forEach(v=>{let y=0;v.addEventListener('scroll',()=>{const t=v.scrollTop,d=t-y;if(Math.abs(d)<8)return;y=t;$('#tabbar').classList.toggle('min',d>0&&t>60)},{passive:true})});
$('#tabbar').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab)});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(U.tab==='chalk')redraw();else if(U.tab==='playbook')renderPlaybook()});
window.addEventListener('resize',()=>{if(U.tab==='playbook')renderPlaybook()});

fixLU();applyTheme();setTab('playbook');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(U.tab==='chalk')redraw();else if(U.tab==='playbook')renderPlaybook()});
})();
</script>
</body></html>
